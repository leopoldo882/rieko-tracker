<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InSinkErator Price Tracker — Italia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* chrome & ink (reference dataviz palette) */
      --page:     #f9f9f7;
      --surface:  #fcfcfb;
      --ink:      #0b0b0b;
      --ink-2:    #52514e;
      --ink-3:    #898781;
      --grid:     #e1e0d9;
      --baseline: #c3c2b7;
      --border:   rgba(11,11,11,.10);
      --shadow:   0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
      --radius:   12px;

      /* status (fixed, never themed) */
      --good:        #0ca30c;
      --good-text:   #006300;
      --warning:     #fab219;
      --critical:    #d03b3b;
      --good-bg:     rgba(12,163,12,.10);
      --critical-bg: rgba(208,59,59,.09);

      /* price-trend accent (sequential blue, step 500) */
      --trend:      #256abf;
      --trend-wash: rgba(37,106,191,.10);

      /* categorical site slots — fixed order, never cycled */
      --s1: #2a78d6;  /* amazon.it */
      --s2: #1baf7a;  /* vieffetrade.com */
      --s3: #eda100;  /* lineadaincasso.it */
      --s4: #008300;  /* opportunitycommerce.com */
      --s5: #4a3aa7;  /* climaconvenienza.it */
      --s6: #e34948;  /* caldaiemurali.it */
      --s7: #e87ba4;  /* yeppon.it */
      --s8: #eb6834;  /* pentoleprofessionali.it */
      --s0: #898781;  /* every further site: neutral (name is always printed) */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page:     #0d0d0d;
        --surface:  #1a1a19;
        --ink:      #ffffff;
        --ink-2:    #c3c2b7;
        --ink-3:    #898781;
        --grid:     #2c2c2a;
        --baseline: #383835;
        --border:   rgba(255,255,255,.10);
        --shadow:   none;

        --good-text:   #0ca30c;
        --good-bg:     rgba(12,163,12,.16);
        --critical-bg: rgba(208,59,59,.16);

        --trend:      #3987e5;
        --trend-wash: rgba(57,135,229,.14);

        --s1: #3987e5;
        --s2: #199e70;
        --s3: #c98500;
        --s4: #008300;
        --s5: #9085e9;
        --s6: #e66767;
        --s7: #d55181;
        --s8: #d95926;
        --s0: #898781;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--page);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    /* ── HEADER ──────────────────────────────────────────────────────────── */
    header {
      background: #0b0b0b;
      color: #fff;
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 64px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 10px 0; }
    .brand-dot {
      width: 10px; height: 10px;
      background: var(--critical);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(208,59,59,.28);
    }
    .brand-name { font-size: .92rem; font-weight: 700; letter-spacing: -.02em; }
    .brand-name span { opacity: .5; font-weight: 500; }
    .brand-sub { font-size: .72rem; color: #898781; margin-top: 1px; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 26px; padding: 10px 0; }
    .stat-chip { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-chip .label { font-size: .62rem; color: #898781; text-transform: uppercase; letter-spacing: .08em; }
    .stat-chip .value { font-size: .84rem; font-weight: 600; color: #f0efec; }

    main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px; }

    /* ── STATUS / ERROR ──────────────────────────────────────────────────── */
    #status {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 80px 24px; color: var(--ink-2);
    }
    #status p { font-size: .9rem; }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid var(--grid);
      border-top-color: var(--critical);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: var(--critical-bg);
      border: 1px solid var(--critical);
      color: var(--ink);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: .85rem;
      display: none;
      margin-bottom: 24px;
      line-height: 1.55;
    }
    .error-box code {
      background: rgba(128,128,128,.15);
      border-radius: 3px; padding: 1px 5px;
      font-size: .82rem; font-family: ui-monospace, monospace;
    }

    /* ── TOOLBAR: health + legend + range filter ─────────────────────────── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px 16px;
      align-items: center; margin-bottom: 22px;
    }
    .range-picker {
      display: inline-flex; gap: 0; border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; background: var(--surface);
    }
    .range-picker button {
      border: 0; background: transparent; color: var(--ink-2);
      font: inherit; font-size: .74rem; font-weight: 600;
      padding: 6px 13px; cursor: pointer;
    }
    .range-picker button + button { border-left: 1px solid var(--border); }
    .range-picker button.active { background: var(--ink); color: var(--page); }
    .toolbar-note { font-size: .72rem; color: var(--ink-3); }

    .health-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 13px 16px;
      margin-bottom: 18px;
    }
    .panel-title {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--ink-3); margin-bottom: 9px;
    }
    .health-grid { display: flex; flex-wrap: wrap; gap: 6px 8px; }
    .health-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .72rem; color: var(--ink-2);
      background: var(--page); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 10px; white-space: nowrap;
    }
    .health-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .health-dot.ok      { background: var(--good); }
    .health-dot.warn    { background: var(--warning); }
    .health-dot.bad     { background: var(--critical); }
    .health-dot.neutral { background: var(--ink-3); }
    .health-chip .meta  { color: var(--ink-3); }

    .legend { display: flex; flex-wrap: wrap; gap: 7px 16px; align-items: center; margin-bottom: 24px; }
    .legend-label {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--ink-3); margin-right: 2px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: .76rem; color: var(--ink-2); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── SECTIONS ────────────────────────────────────────────────────────── */
    .section { margin-bottom: 36px; }
    .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
    .section-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -.02em; }
    .section-sub { font-size: .74rem; color: var(--ink-3); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      gap: 18px;
    }

    /* ── CARD ────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-head {
      padding: 16px 20px 13px;
      border-bottom: 1px solid var(--grid);
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
    }
    .model-name { font-size: .98rem; font-weight: 700; letter-spacing: -.01em; }
    .model-spec { font-size: .72rem; color: var(--ink-3); margin-top: 3px; font-weight: 500; }
    .model-meta { font-size: .68rem; color: var(--ink-3); margin-top: 5px; }
    .best-pill {
      flex-shrink: 0; text-align: right;
      background: var(--page); border: 1px solid var(--border);
      border-radius: 9px; padding: 7px 12px;
    }
    .best-pill .lbl {
      font-size: .58rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--ink-3);
    }
    .best-pill .val { font-size: 1.02rem; font-weight: 700; white-space: nowrap; }
    .best-pill .sub { font-size: .64rem; color: var(--ink-3); white-space: nowrap; }
    .best-pill.all-out .val { color: var(--critical); font-size: .84rem; }

    .card-body { padding: 10px 20px 16px; flex: 1; }

    .allout-banner {
      display: flex; align-items: center; gap: 8px;
      background: var(--critical-bg); border: 1px solid var(--critical);
      color: var(--ink); border-radius: 8px;
      font-size: .76rem; font-weight: 600;
      padding: 7px 11px; margin: 4px 0 8px;
    }

    /* price rows */
    .price-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; }
    .price-row + .price-row { border-top: 1px solid var(--grid); }
    .site-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .site-label {
      font-size: .75rem; color: var(--ink-2); width: 152px; flex-shrink: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;
    }
    .bar-track { flex: 1; height: 8px; background: var(--page); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 0 4px 4px 0; min-width: 4px; transition: width .5s cubic-bezier(.4,0,.2,1); }
    .price-num {
      font-size: .82rem; font-weight: 600; width: 74px; text-align: right;
      flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .tag {
      font-size: .58rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .tag-best { background: var(--good-bg); color: var(--good-text); }
    .tag-out  { background: var(--critical-bg); color: var(--critical); }
    .price-row.out-of-stock .site-label, .price-row.out-of-stock .price-num { opacity: .55; }
    .price-row.out-of-stock .price-num { text-decoration: line-through; }
    .price-row.out-of-stock .bar-fill { opacity: .3; }
    .link-btn {
      display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 5px; color: var(--ink-3);
      text-decoration: none; transition: background .15s, color .15s; flex-shrink: 0;
    }
    .link-btn:hover { background: var(--page); color: var(--ink); }

    /* site colors */
    .c1 { background: var(--s1); } .c2 { background: var(--s2); }
    .c3 { background: var(--s3); } .c4 { background: var(--s4); }
    .c5 { background: var(--s5); } .c6 { background: var(--s6); }
    .c7 { background: var(--s7); } .c8 { background: var(--s8); }
    .c0 { background: var(--s0); }

    /* ── SPARKLINE ───────────────────────────────────────────────────────── */
    .spark-wrap { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--grid); }
    .spark-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
    .spark-title {
      font-size: .62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--ink-3);
    }
    .spark-range { font-size: .66rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .spark-box { position: relative; }
    .spark-box svg { display: block; width: 100%; height: 74px; }
    .spark-tip {
      position: absolute; pointer-events: none; display: none;
      background: var(--ink); color: var(--page);
      border-radius: 6px; padding: 5px 9px;
      font-size: .7rem; line-height: 1.45; white-space: nowrap;
      transform: translate(-50%, -100%);
      z-index: 5;
    }
    .spark-tip .v { font-weight: 700; font-size: .78rem; }

    /* ── STOCK HISTORY ───────────────────────────────────────────────────── */
    .stock-history { margin-top: 11px; padding-top: 9px; border-top: 1px dashed var(--grid); }
    .history-line {
      display: flex; align-items: center; gap: 7px;
      font-size: .71rem; color: var(--ink-2); padding: 2px 0;
    }
    .history-line .h-date {
      color: var(--ink-3); width: 56px; flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .h-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .h-dot.out { background: var(--critical); }
    .h-dot.in  { background: var(--good); }
    .history-line strong { font-weight: 600; }

    /* ── OTHER-PRODUCTS TABLE ────────────────────────────────────────────── */
    .other-table-wrap {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto;
    }
    table.other { width: 100%; border-collapse: collapse; font-size: .78rem; }
    table.other th {
      text-align: left; font-size: .64rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3);
      padding: 11px 16px 8px; border-bottom: 1px solid var(--grid);
    }
    table.other td { padding: 8px 16px; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
    table.other tr:last-child td { border-bottom: 0; }
    table.other td.price { font-weight: 600; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.other td.name  { max-width: 520px; }
    table.other .site-cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

    footer { text-align: center; padding: 24px 16px 32px; font-size: .72rem; color: var(--ink-3); }
    footer a { color: var(--ink-3); text-underline-offset: 3px; }

    @media (max-width: 640px) {
      header { padding: 0 16px; gap: 12px; }
      main   { padding: 20px 12px 40px; }
      .grid  { grid-template-columns: 1fr; }
      .site-label { width: 104px; }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <div>
      <div class="brand-name">InSinkErator <span>Price Tracker</span></div>
      <div class="brand-sub">Italia · aggiornato ogni giorno</div>
    </div>
  </div>
  <div class="header-right">
    <div class="stat-chip"><span class="label">Modelli</span><span class="value" id="hdr-models">—</span></div>
    <div class="stat-chip"><span class="label">Siti</span><span class="value" id="hdr-sites">—</span></div>
    <div class="stat-chip"><span class="label">Offerte</span><span class="value" id="hdr-listings">—</span></div>
    <div class="stat-chip"><span class="label">Aggiornato</span><span class="value" id="hdr-date">—</span></div>
  </div>
</header>

<main>
  <div class="error-box" id="err"></div>

  <div id="status">
    <div class="spinner"></div>
    <p>Caricamento prezzi…</p>
  </div>

  <div id="content" style="display:none">
    <div class="health-panel" id="health-panel" style="display:none">
      <div class="panel-title">Stato raccolta dati — ultimo aggiornamento riuscito per sito</div>
      <div class="health-grid" id="health-grid"></div>
    </div>

    <div class="toolbar">
      <div class="range-picker" id="range-picker" role="group" aria-label="Intervallo storico prezzi">
        <button data-days="30">30 giorni</button>
        <button data-days="90" class="active">90 giorni</button>
        <button data-days="0">Tutto</button>
      </div>
      <span class="toolbar-note">L'intervallo si applica ai grafici di andamento prezzo</span>
    </div>

    <div class="legend" id="legend"></div>

    <div id="sections"></div>
  </div>
</main>

<footer>
  Dati raccolti ogni giorno alle 07:00 UTC da <span id="footer-sites"></span>
</footer>

<script>
  /* ─────────────────────────────────────────────────────────────────────────
     Data comes exclusively from repo-relative JSON written by scraper.py:
       latest.json         today's rows, each with canonical model/category
       price_history.json  per model → per site → [[date, min price], …]
       stock_history.json  in/out-of-stock transitions (with model field)
       site_health.json    per-site scrape health
     Model canonicalization lives in Python — this file only renders.
  ──────────────────────────────────────────────────────────────────────── */

  const CATEGORY_META = {
    disposer: { title: 'Dissipatori di rifiuti alimentari', sub: 'ordinati per diffusione — dal più venduto sul mercato italiano' },
    tap:      { title: 'Erogatori di acqua bollente e accessori idraulici', sub: 'rubinetti istantanei, kit con NeoTank' },
    other:    { title: 'Altri prodotti InSinkErator', sub: 'articoli visti sui siti monitorati ma non riconducibili a un modello noto' },
  };
  const CATEGORY_ORDER = ['disposer', 'tap'];

  /* Fixed categorical slot per site (never cycled; extra sites → neutral c0).
     Every pip sits beside the printed site name, so identity never relies on
     color alone. */
  const SITE_SLOTS = {
    'amazon.it': 'c1',
    'vieffetrade.com': 'c2',
    'lineadaincasso.it': 'c3',
    'opportunitycommerce.com': 'c4',
    'climaconvenienza.it': 'c5',
    'caldaiemurali.it': 'c6',
    'yeppon.it': 'c7',
    'pentoleprofessionali.it': 'c8',
  };
  const siteClass = site => SITE_SLOTS[site] || 'c0';

  /* ── helpers ── */
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtEur = v => '€ ' + v.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtEur0 = v => '€ ' + Math.round(v).toLocaleString('it-IT');
  const fmtDay = iso => {
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
  };
  const daysSince = iso => {
    const ms = Date.now() - new Date(iso).getTime();
    return isNaN(ms) ? null : Math.max(0, Math.floor(ms / 86400000));
  };
  function relTime(iso) {
    if (!iso) return 'mai';
    const ms = Date.now() - new Date(iso).getTime();
    if (isNaN(ms)) return '?';
    const mins = Math.round(ms / 60000);
    if (mins < 60) return mins + ' min fa';
    const hrs = Math.round(mins / 60);
    if (hrs < 48) return hrs + ' h fa';
    return Math.round(hrs / 24) + ' g fa';
  }
  const svgExternal = () => `<svg width="12" height="12" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

  /* ── state ── */
  let LATEST = null;        /* latest.json payload */
  let HISTORY = {};         /* price_history.json */
  let STOCK = [];           /* stock_history.json records */
  let RANGE_DAYS = 90;      /* sparkline window (0 = all) */

  /* ── grouping ─────────────────────────────────────────────────────────── */

  /* one entry per (model, site): prefer in-stock over out-of-stock, then cheapest */
  function groupRows(rows) {
    const models = {};   /* model → site → row */
    const others = [];
    for (const r of rows) {
      if (!r.model) {
        if (r.price_eur > 0) others.push(r);
        continue;
      }
      const perSite = models[r.model] = models[r.model] || {};
      const cur = perSite[r.site];
      const curOut = cur && cur.stock_status === 'out_of_stock';
      const newOut = r.stock_status === 'out_of_stock';
      if (!cur || (curOut && !newOut) || (curOut === newOut && r.price_eur < cur.price_eur)) {
        perSite[r.site] = r;
      }
    }
    return { models, others };
  }

  function modelCategory(model, rows) {
    const r = rows.find(x => x.model === model);
    return r ? r.category : 'other';
  }

  /* popularity: number of sites listing it, then listings, then lower price */
  function sortModels(models, rows) {
    return Object.keys(models).sort((a, b) => {
      const sa = Object.keys(models[a]).length, sb = Object.keys(models[b]).length;
      if (sb !== sa) return sb - sa;
      const la = rows.filter(r => r.model === a).length, lb = rows.filter(r => r.model === b).length;
      if (lb !== la) return lb - la;
      const pa = Math.min(...Object.values(models[a]).map(r => r.price_eur));
      const pb = Math.min(...Object.values(models[b]).map(r => r.price_eur));
      return pa - pb;
    });
  }

  /* ── stock history ────────────────────────────────────────────────────── */

  function historyForModel(model) {
    return STOCK
      .filter(rec => rec.model === model)
      .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  }
  function soldOutSince(records, site) {
    const rec = records.find(r => r.site === site && r.new_status === 'out_of_stock');
    return rec ? rec.timestamp : null;
  }

  function buildStockHistory(records) {
    if (!records.length) return '';
    const lines = records.slice(0, 5).map(rec => {
      const out = rec.new_status === 'out_of_stock';
      return `<div class="history-line">
        <span class="h-date">${esc(fmtDay(rec.timestamp))}</span>
        <span class="h-dot ${out ? 'out' : 'in'}"></span>
        <span><strong>${esc(rec.site)}</strong> · ${out ? 'esaurito' : 'di nuovo disponibile'}</span>
      </div>`;
    }).join('');
    return `<div class="stock-history">
      <div class="panel-title" style="margin-bottom:5px">Storico disponibilità</div>${lines}
    </div>`;
  }

  /* ── sparkline ────────────────────────────────────────────────────────── */

  /* daily cheapest price across sites for a model, [{d, p, site}] sorted.
     Each site's series is forward-filled across gaps of up to 7 days, so a
     missed scrape doesn't read as a price change in the minimum. */
  function cheapestSeries(model) {
    const perSite = HISTORY[model];
    if (!perSite) return [];
    const dates = [...new Set(
      Object.values(perSite).flatMap(pts => pts.map(p => p[0]))
    )].sort();
    const FILL_MS = 7 * 86400000;
    const byDay = {};
    for (const [site, points] of Object.entries(perSite)) {
      const map = new Map(points);
      let lastD = null, lastP = null;
      for (const d of dates) {
        if (map.has(d)) { lastD = d; lastP = map.get(d); }
        else if (lastD && (new Date(d) - new Date(lastD)) > FILL_MS) lastP = null;
        if (lastP == null) continue;
        if (!byDay[d] || lastP < byDay[d].p) byDay[d] = { d, p: lastP, site };
      }
    }
    let series = Object.values(byDay).sort((a, b) => a.d < b.d ? -1 : 1);
    if (RANGE_DAYS > 0) {
      const cutoff = new Date(Date.now() - RANGE_DAYS * 86400000).toISOString().slice(0, 10);
      series = series.filter(pt => pt.d >= cutoff);
    }
    return series;
  }

  const SPARK_W = 460, SPARK_H = 74, SPARK_PAD = { t: 8, r: 8, b: 6, l: 8 };

  function buildSparkline(model, cardIdx) {
    const series = cheapestSeries(model);
    if (series.length < 2) return '';

    const prices = series.map(pt => pt.p);
    const lo = Math.min(...prices), hi = Math.max(...prices);
    const span = (hi - lo) || 1;
    const w = SPARK_W - SPARK_PAD.l - SPARK_PAD.r;
    const h = SPARK_H - SPARK_PAD.t - SPARK_PAD.b;
    const X = i => SPARK_PAD.l + (series.length === 1 ? w / 2 : (i / (series.length - 1)) * w);
    const Y = p => SPARK_PAD.t + h - ((p - lo) / span) * h;

    const line = series.map((pt, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(pt.p).toFixed(1)}`).join('');
    const area = `${line}L${X(series.length - 1).toFixed(1)},${SPARK_H - SPARK_PAD.b}L${X(0).toFixed(1)},${SPARK_H - SPARK_PAD.b}Z`;
    const last = series[series.length - 1];

    /* recessive midline gridline */
    const midY = SPARK_PAD.t + h / 2;

    return `<div class="spark-wrap">
      <div class="spark-head">
        <span class="spark-title">Prezzo più basso — andamento</span>
        <span class="spark-range">min ${fmtEur0(lo)} · max ${fmtEur0(hi)}</span>
      </div>
      <div class="spark-box" data-spark="${cardIdx}">
        <svg viewBox="0 0 ${SPARK_W} ${SPARK_H}" preserveAspectRatio="none" aria-label="Andamento del prezzo più basso per ${esc(model)}">
          <line x1="${SPARK_PAD.l}" y1="${midY}" x2="${SPARK_W - SPARK_PAD.r}" y2="${midY}" stroke="var(--grid)" stroke-width="1"/>
          <path d="${area}" fill="var(--trend-wash)"/>
          <path d="${line}" fill="none" stroke="var(--trend)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          <line class="tip-x" x1="0" y1="${SPARK_PAD.t - 3}" x2="0" y2="${SPARK_H - SPARK_PAD.b}" stroke="var(--baseline)" stroke-width="1" style="display:none"/>
          <circle class="tip-dot" r="4" fill="var(--trend)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
          <circle cx="${X(series.length - 1)}" cy="${Y(last.p)}" r="4" fill="var(--trend)" stroke="var(--surface)" stroke-width="2"/>
        </svg>
        <div class="spark-tip"></div>
      </div>
    </div>`;
  }

  /* hover layer: crosshair snapping to nearest date + tooltip */
  function wireSparkline(box, model) {
    const series = cheapestSeries(model);
    if (series.length < 2) return;
    const svg = box.querySelector('svg');
    const tip = box.querySelector('.spark-tip');
    const xline = svg.querySelector('.tip-x');
    const dot = svg.querySelector('.tip-dot');

    const w = SPARK_W - SPARK_PAD.l - SPARK_PAD.r;
    const h = SPARK_H - SPARK_PAD.t - SPARK_PAD.b;
    const prices = series.map(pt => pt.p);
    const lo = Math.min(...prices), hi = Math.max(...prices);
    const span = (hi - lo) || 1;
    const X = i => SPARK_PAD.l + (i / (series.length - 1)) * w;
    const Y = p => SPARK_PAD.t + h - ((p - lo) / span) * h;

    function onMove(ev) {
      const rect = svg.getBoundingClientRect();
      const fx = (ev.clientX - rect.left) / rect.width * SPARK_W;
      const i = Math.max(0, Math.min(series.length - 1,
        Math.round((fx - SPARK_PAD.l) / w * (series.length - 1))));
      const pt = series[i];
      const px = X(i), py = Y(pt.p);
      xline.setAttribute('x1', px); xline.setAttribute('x2', px);
      xline.style.display = '';
      dot.setAttribute('cx', px); dot.setAttribute('cy', py);
      dot.style.display = '';
      tip.style.display = 'block';
      tip.style.left = (px / SPARK_W * rect.width) + 'px';
      tip.style.top = (py / SPARK_H * rect.height - 8) + 'px';
      tip.replaceChildren();
      const v = document.createElement('div');
      v.className = 'v'; v.textContent = fmtEur(pt.p);
      const m = document.createElement('div');
      m.textContent = fmtDay(pt.d) + ' · ' + pt.site;
      tip.append(v, m);
    }
    function onLeave() {
      tip.style.display = 'none';
      xline.style.display = 'none';
      dot.style.display = 'none';
    }
    box.addEventListener('pointermove', onMove);
    box.addEventListener('pointerleave', onLeave);
  }

  /* ── card ─────────────────────────────────────────────────────────────── */

  function buildCard(model, perSite, cardIdx) {
    const rows = Object.values(perSite).sort((a, b) => a.price_eur - b.price_eur);
    const inStock = rows.filter(r => r.stock_status !== 'out_of_stock');
    const allOut = inStock.length === 0;
    const best = (inStock.length ? inStock : rows)[0];
    const maxP = Math.max(...rows.map(r => r.price_eur));
    const spec = (LATEST.specs || {})[model] || '';
    const records = historyForModel(model);

    const rowsHtml = rows.map(r => {
      const isOut = r.stock_status === 'out_of_stock';
      const isBest = !isOut && r === best && rows.length > 1;
      const barW = maxP > 0 ? Math.max(4, Math.round(r.price_eur / maxP * 100)) : 100;
      const since = isOut ? soldOutSince(records, r.site) : null;
      const outTag = isOut
        ? `<span class="tag tag-out">⛔ Esaurito${since ? ' dal ' + esc(fmtDay(since)) : ''}</span>` : '';
      const bestTag = isBest ? `<span class="tag tag-best">✓ migliore</span>` : '';
      return `<div class="price-row${isOut ? ' out-of-stock' : ''}">
        <span class="site-pip ${siteClass(r.site)}"></span>
        <span class="site-label" title="${esc(r.product_name)}">${esc(r.site)}</span>
        <div class="bar-track"><div class="bar-fill ${siteClass(r.site)}" style="width:${barW}%"></div></div>
        <span class="price-num">${fmtEur(r.price_eur)}</span>
        ${bestTag}${outTag}
        <a class="link-btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Apri su ${esc(r.site)}">${svgExternal()}</a>
      </div>`;
    }).join('');

    const bestPill = allOut
      ? `<div class="best-pill all-out"><div class="lbl">Disponibilità</div><div class="val">Esaurito ovunque</div></div>`
      : `<div class="best-pill"><div class="lbl">Miglior prezzo</div>
           <div class="val">${fmtEur(best.price_eur)}</div>
           <div class="sub">${esc(best.site)}</div></div>`;

    const allOutBanner = allOut
      ? `<div class="allout-banner">⛔ Esaurito su tutti i siti monitorati</div>` : '';

    return `<div class="card" data-model="${esc(model)}">
      <div class="card-head">
        <div>
          <div class="model-name">${esc(model)}</div>
          ${spec ? `<div class="model-spec">${esc(spec)}</div>` : ''}
          <div class="model-meta">${rows.length} sit${rows.length === 1 ? 'o' : 'i'} · ${inStock.length} disponibil${inStock.length === 1 ? 'e' : 'i'}</div>
        </div>
        ${bestPill}
      </div>
      <div class="card-body">
        ${allOutBanner}
        ${rowsHtml}
        ${buildSparkline(model, cardIdx)}
        ${buildStockHistory(records)}
      </div>
    </div>`;
  }

  /* ── other-products table ─────────────────────────────────────────────── */

  function buildOtherSection(others) {
    if (!others.length) return '';
    /* dedupe by site+name, cheapest first */
    const seen = {};
    for (const r of others) {
      const k = r.site + '|' + r.product_name;
      if (!seen[k] || r.price_eur < seen[k].price_eur) seen[k] = r;
    }
    const rows = Object.values(seen).sort((a, b) => b.price_eur - a.price_eur);
    const meta = CATEGORY_META.other;
    const trs = rows.map(r => `<tr>
      <td class="name">${esc(r.product_name)}</td>
      <td><span class="site-cell"><span class="site-pip ${siteClass(r.site)}"></span>${esc(r.site)}</span></td>
      <td class="price">${fmtEur(r.price_eur)}</td>
      <td><a class="link-btn" href="${esc(r.url)}" target="_blank" rel="noopener" title="Apri su ${esc(r.site)}">${svgExternal()}</a></td>
    </tr>`).join('');
    return `<div class="section">
      <div class="section-head">
        <span class="section-title">${meta.title}</span>
        <span class="section-sub">${meta.sub}</span>
      </div>
      <div class="other-table-wrap">
        <table class="other">
          <thead><tr><th>Prodotto</th><th>Sito</th><th style="text-align:right">Prezzo</th><th></th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>
    </div>`;
  }

  /* ── health panel ─────────────────────────────────────────────────────── */

  const STATUS_KIND = {
    success: 'ok', retried: 'ok', playwright: 'ok', ok: 'ok',
    empty: 'neutral', no_shop: 'neutral',
    blocked: 'bad', failed: 'bad',
  };
  const STATUS_LABEL = {
    success: 'ok', retried: 'ok (2° tentativo)', playwright: 'ok (browser)',
    empty: 'nessun prodotto', no_shop: 'nessun negozio',
    blocked: 'bloccato', failed: 'errore',
  };

  function renderHealth(health) {
    if (!health || !health.sites) return;
    const chips = Object.entries(health.sites)
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([site, s]) => {
        const kind = STATUS_KIND[s.status] || 'warn';
        const label = STATUS_LABEL[s.status] || s.status;
        const meta = s.product_count > 0
          ? `${s.product_count} · ${relTime(s.last_success)}`
          : `${label} · ultimo ok ${relTime(s.last_success)}`;
        return `<span class="health-chip" title="stato: ${esc(label)} — ultimo controllo ${esc(relTime(s.last_run))}">
          <span class="health-dot ${kind}"></span>${esc(site)}<span class="meta">${esc(meta)}</span></span>`;
      }).join('');
    document.getElementById('health-grid').innerHTML = chips;
    document.getElementById('health-panel').style.display = 'block';
  }

  /* ── render ───────────────────────────────────────────────────────────── */

  function render() {
    const rows = LATEST.rows.filter(r => r.price_eur > 0);
    const { models, others } = groupRows(rows);

    const sitesPresent = [...new Set(rows.map(r => r.site))].sort();

    /* header stats */
    document.getElementById('hdr-models').textContent = Object.keys(models).length;
    document.getElementById('hdr-sites').textContent = sitesPresent.length;
    document.getElementById('hdr-listings').textContent = rows.length;
    document.getElementById('hdr-date').textContent = LATEST.date || fmtDay(LATEST.generated);

    /* legend */
    document.getElementById('legend').innerHTML =
      `<span class="legend-label">Siti</span>` + sitesPresent.map(site =>
        `<span class="legend-item"><span class="legend-dot ${siteClass(site)}"></span>${esc(site)}</span>`
      ).join('');

    /* sections by category, models by popularity */
    let cardIdx = 0;
    const sectionsHtml = CATEGORY_ORDER.map(cat => {
      const catModels = sortModels(models, rows)
        .filter(m => modelCategory(m, rows) === cat);
      if (!catModels.length) return '';
      const meta = CATEGORY_META[cat];
      const cards = catModels.map(m => buildCard(m, models[m], cardIdx++)).join('');
      return `<div class="section">
        <div class="section-head">
          <span class="section-title">${meta.title}</span>
          <span class="section-sub">${meta.sub}</span>
        </div>
        <div class="grid">${cards}</div>
      </div>`;
    }).join('') + buildOtherSection(others);

    document.getElementById('sections').innerHTML = sectionsHtml;

    /* wire sparkline hover layers */
    document.querySelectorAll('.card').forEach(card => {
      const model = card.getAttribute('data-model');
      const box = card.querySelector('.spark-box');
      if (box) wireSparkline(box, model);
    });

    document.getElementById('footer-sites').innerHTML = sitesPresent
      .map(s => `<a href="https://www.${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>`)
      .join(' · ');

    document.getElementById('status').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  /* range picker re-renders all charts against the same slice */
  document.getElementById('range-picker').addEventListener('click', ev => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    RANGE_DAYS = parseInt(btn.dataset.days, 10);
    document.querySelectorAll('#range-picker button')
      .forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  /* ── fetch ────────────────────────────────────────────────────────────── */

  const fetchJson = path => fetch(path).then(r => (r.ok ? r.json() : null)).catch(() => null);

  Promise.all([
    fetchJson('latest.json'),
    fetchJson('price_history.json'),
    fetchJson('stock_history.json'),
    fetchJson('site_health.json'),
  ]).then(([latest, history, stock, health]) => {
    if (!latest || !Array.isArray(latest.rows)) {
      document.getElementById('status').style.display = 'none';
      const box = document.getElementById('err');
      box.style.display = 'block';
      const isLocal = location.protocol === 'file:';
      box.innerHTML = isLocal
        ? '<strong>Impossibile caricare i dati</strong> — il browser blocca le richieste da <code>file://</code>. ' +
          'Servi la pagina via HTTP (es. <code>python3 -m http.server 8080</code>) o usa GitHub Pages.'
        : '<strong>latest.json non trovato</strong> — esegui <code>python3 scraper.py</code> per generare i dati.';
      return;
    }
    LATEST = latest;
    HISTORY = history || {};
    STOCK = Array.isArray(stock) ? stock : [];
    render();
    renderHealth(health);
  });
</script>
</body>
</html>
